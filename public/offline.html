<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a14" />
    <title>Stickman Launcher - Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #060a14 0%, #0d172c 65%, #14532d 100%);
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 28px 24px;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 20px;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #cbd5e1;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #0284c7;
        color: #ffffff;
        padding: 12px 22px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #0ea5e9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Stickman Launcher</h1>
      <p>You appear to be offline and this page has not finished caching yet. Reconnect once to finish saving the game for offline play.</p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
